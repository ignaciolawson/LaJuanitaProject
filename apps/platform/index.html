<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sistema interno: no se indexa nunca. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Las tres familias de la marca, las mismas que la landing.

      ⚠️ `wdth,wght@62..125,400..800` — el eje de ANCHO es la razón de elegir
      Archivo, y hay que pedirlo explícitamente: sin `wdth` en la URL, Google
      sirve sólo el eje de peso y `font-stretch` no hace absolutamente nada.
      No falla ni avisa: la página compila, carga la fuente, y el contraste
      tipográfico simplemente no está. Es la misma trampa que la landing
      documenta para `axes: ["wdth"]` de next/font.

      Los ejes van en orden alfabético en la URL o Google devuelve 400.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
    />

    <!--
      El tema, ANTES de que React monte.

      ⚠️ Tiene que ser un script bloqueante en el <head> y no un efecto de
      React: si el tema se aplicara al montar, quien eligió oscuro vería un
      flash blanco a pantalla completa en cada carga. Es la única razón por
      la que hay JavaScript en este archivo.

      Lee la misma clave que `src/tema/tema.ts` y no puede importarla —acá
      no hay módulos todavía—, así que el string está escrito dos veces.
      Si cambia, cambia en los dos lados.

      Sin nada guardado no adivina: deja el claro del CSS y el default por
      perfil lo resuelve `useTema` cuando ya sabe quién entró.
    -->
    <script>
      try {
        var t = localStorage.getItem('lajuanita.tema')
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t
      } catch (e) {
        /* modo privado o cookies bloqueadas: se usa el claro por defecto */
      }
    </script>

    <title>La Juanita — Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
