<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    EL ABANICO DE LA MARCA, como ícono de pestaña (mejoras.md §12 · A8).

    Reemplaza al rayito violeta que vino con la plantilla de Vite.

    ⚠️ Es una TERCERA copia del dibujo y hay que saberlo: `Abanico.tsx` ya es
    una copia de `apps/landing/src/components/brand/Fan.tsx`, y ésta no puede
    salir de ninguna de las dos — el navegador pide el favicon antes de que
    corra un módulo. Si el dibujo de la marca cambia, cambia en los tres lados.

    Dos diferencias con el componente, las dos por el tamaño: nueve varillas en
    vez de trece (a 16 px, trece se empastan en una mancha) y el arco interior
    afuera. Lo que se conserva es el algoritmo — mismo pivote, misma apertura de
    156°, mismas varillas del medio un poco más largas.

    Va sobre el cuadrado de tinta y no suelto: una pestaña puede ser clara u
    oscura y el rojo de marca no rinde contra las dos. Con el fondo propio, el
    ícono se ve igual en los dos temas del navegador.
  -->
  <rect width="64" height="64" rx="13" fill="#0a0a0b"/>
  <g fill="#e52328" stroke="#e52328">
    <g transform="translate(32.0 43.5)" stroke="none">
      <path d="M -0.70 -6.20 L 0.70 -6.20 L 1.02 -21.80 L -1.02 -21.80 Z" transform="rotate(-78.000)"/>
      <path d="M -0.74 -6.20 L 0.74 -6.20 L 1.09 -21.98 L -1.09 -21.98 Z" transform="rotate(-58.500)"/>
      <path d="M -0.79 -6.20 L 0.79 -6.20 L 1.16 -22.15 L -1.16 -22.15 Z" transform="rotate(-39.000)"/>
      <path d="M -0.84 -6.20 L 0.84 -6.20 L 1.23 -22.32 L -1.23 -22.32 Z" transform="rotate(-19.500)"/>
      <path d="M -0.88 -6.20 L 0.88 -6.20 L 1.30 -22.50 L -1.30 -22.50 Z" transform="rotate(0.000)"/>
      <path d="M -0.84 -6.20 L 0.84 -6.20 L 1.23 -22.32 L -1.23 -22.32 Z" transform="rotate(19.500)"/>
      <path d="M -0.79 -6.20 L 0.79 -6.20 L 1.16 -22.15 L -1.16 -22.15 Z" transform="rotate(39.000)"/>
      <path d="M -0.74 -6.20 L 0.74 -6.20 L 1.09 -21.98 L -1.09 -21.98 Z" transform="rotate(58.500)"/>
      <path d="M -0.70 -6.20 L 0.70 -6.20 L 1.02 -21.80 L -1.02 -21.80 Z" transform="rotate(78.000)"/>
      <circle r="2.5"/>
    </g>
    <path d="M 9.99 38.82 A 22.5 22.5 0 0 1 54.01 38.82" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
