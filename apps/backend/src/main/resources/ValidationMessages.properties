# Los mensajes de Bean Validation para las anotaciones que no traen el suyo.
#
# Sin este archivo, un @Size(max = 80) sin `message` respondía con el texto por
# defecto de Hibernate Validator, que sale en el idioma de la máquina: en esta PC
# en castellano, y en el servidor (Docker, en inglés) "size must be between 0 and
# 80" debajo del campo del formulario. Había ~55 así (barrida de textos del
# 2026-10-18). Lo que cada anotación dice en su `message` sigue mandando; esto es
# sólo el piso para las que no lo dicen.
#
# Java lee los .properties de un ResourceBundle como UTF-8 (desde Java 9).

jakarta.validation.constraints.Size.message=Es demasiado largo: el máximo es {max} caracteres.
jakarta.validation.constraints.NotNull.message=Completá este dato.
jakarta.validation.constraints.NotBlank.message=Completá este dato.
jakarta.validation.constraints.NotEmpty.message=Completá este dato.
jakarta.validation.constraints.Email.message=Ese email no tiene un formato válido.
jakarta.validation.constraints.Pattern.message=Ese dato no tiene un formato válido.
jakarta.validation.constraints.Min.message=Tiene que ser {value} o más.
jakarta.validation.constraints.Max.message=Tiene que ser {value} o menos.
jakarta.validation.constraints.Positive.message=Tiene que ser mayor a cero.
jakarta.validation.constraints.PositiveOrZero.message=No puede ser negativo.
jakarta.validation.constraints.DecimalMin.message=Tiene que ser {value} o más.
jakarta.validation.constraints.DecimalMax.message=Tiene que ser {value} o menos.
jakarta.validation.constraints.Digits.message=Ese número tiene demasiados dígitos.
jakarta.validation.constraints.Past.message=La fecha tiene que ser anterior a hoy.
jakarta.validation.constraints.PastOrPresent.message=La fecha no puede ser futura.
jakarta.validation.constraints.Future.message=La fecha tiene que ser posterior a hoy.
jakarta.validation.constraints.FutureOrPresent.message=La fecha no puede ser pasada.
jakarta.validation.constraints.AssertTrue.message=Revisá este dato.
jakarta.validation.constraints.AssertFalse.message=Revisá este dato.
