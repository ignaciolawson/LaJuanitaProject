spring.application.name=backend

# Base de datos.
#
# Los tres valores por defecto son los del docker-compose de desarrollo y estan
# commiteados a proposito, igual que el secreto JWT: para que un clone arranque.
# En cualquier entorno accesible desde afuera van por variable de entorno, y la
# contrasena tiene que ser OTRA -- `la_juanita` es publica.
#
# La tabla de que definir en cada ambiente esta en el README, seccion "Antes de
# desplegar esto en algun lado". Antes de esto el checklist nombraba solo
# JWT_SECRET, con tono de estar completo: el secreto del token tenia indireccion
# por entorno y aviso por log, y la contrasena de la base no tenia ninguna de
# las dos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/la_juanita}
spring.datasource.username=${DB_USER:la_juanita}
spring.datasource.password=${DB_PASSWORD:la_juanita}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Que los errores que maneja Spring por su cuenta (parametro con tipo
# equivocado, parametro faltante, metodo no soportado) tambien salgan como
# ProblemDetail.
#
# Sin esto conviven DOS formatos de error: el nuestro (RFC 7807, con `detail` y
# `errores`) y el crudo de Spring, con `timestamp` y `error`. El front busca el
# mensaje en `detail` y con el segundo formato no encuentra nada que mostrar.
spring.mvc.problemdetails.enabled=true

# Firma de la credencial (JWT).
#
# El secreto es Base64 y tiene que dar >=32 bytes al decodificar: HS256 lo
# exige, y SeguridadConfig falla al arrancar si no llega. El valor de abajo es
# SOLO PARA DESARROLLO y esta commiteado a proposito, para que el proyecto
# arranque recien clonado. En el deploy real se pisa con la variable de entorno
# JWT_SECRET, y ese valor no vive en el repo.
#
# ROTADO el 2026-08-14. El valor anterior estuvo publicado en un repositorio
# publico y hay que darlo por conocido para siempre: con el se fabricaba un
# token de ADMIN sin saber ninguna contrasena. Pasar el repo a privado no
# despublica lo que ya se pudo copiar, por eso se rota igual.
#
# Este valor tampoco es secreto: esta commiteado. Sirve para desarrollo y nada
# mas. En produccion va JWT_SECRET, con un valor NUEVO generado ahi.
lajuanita.jwt.secreto=${JWT_SECRET:QwlFr0vrNFMCnzl24JRPUyKC/bVZ+R9cLvnusf1JL0k5E22Ds3XHvDjsbwWZ2doe}

# SOLO DESARROLLO LOCAL. Ningun entorno accesible desde afuera debe tener esta
# linea: sin ella, la aplicacion se NIEGA A ARRANCAR si detecta que esta
# firmando con el secreto commiteado de arriba.
#
# El default es fallar cerrado a proposito. Antes el bloqueo dependia de que
# hubiera un perfil `prod` activo, y nada en este repo activa un perfil: un
# `docker compose up` sin variables arrancaba, firmaba con la clave publica y
# solo dejaba un WARN perdido en el log de arranque. El caso que hay que
# atrapar es el del que se olvido de configurar algo, asi que el candado no
# puede exigir haber configurado otra cosa.
lajuanita.jwt.permitir-secreto-de-desarrollo=true

# Cuanto vale el token desde que se emite.
#
# 8 horas es una jornada: Micaela entra a la manana y no tiene que volver a
# loguearse al mediodia.
#
# Dar de baja a alguien le corta el acceso EN EL ACTO, en todos los endpoints:
# la autorizacion no lee el rol del token, relee el usuario de la base en cada
# pedido (AutenticacionDesdeBase). Este comentario decia lo contrario -- que la
# baja tardaba hasta 8 horas y que solo /api/me la aplicaba enseguida -- y
# describia con precision el bug que la auditoria del 2026-08-12 midio y
# corrigio.
#
# Lo que si sigue abierto es el token ROBADO: no hay forma de revocarlo antes
# de que venza, asi que vale hasta 8 horas en manos de quien se lo llevo. La
# solucion a eso es una lista de tokens revocados, no bajar este numero a
# minutos.
lajuanita.jwt.duracion=8h

# Claim `iss`. Se firma con el y se EXIGE al validar, junto con `exp`. El
# validador por defecto de Spring no exige que el token declare vencimiento
# (solo lo controla si esta presente), asi que sin esto un token sin `exp`
# valdria para siempre.
lajuanita.jwt.emisor=la-juanita

# Origenes autorizados a llamar la API desde el navegador. En desarrollo, el
# server de Vite de `platform`.
lajuanita.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Salud del servicio. SOLO /actuator/health: es lo que consulta el healthcheck
# del compose y lo que puede mirar un monitor externo. El resto de Actuator
# —metricas, variables de entorno, beans— queda apagado: no hace falta, y cada
# endpoint expuesto es superficie de mas.
management.endpoints.web.exposure.include=health
# Sin detalle: `UP` o `DOWN` y nada mas. `when-authorized` no sirve acá porque
# el endpoint es publico, y el detalle incluye el estado de la base con su URL.
management.endpoint.health.show-details=never
