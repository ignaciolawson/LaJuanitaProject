services:
  postgres:
    image: postgres:16-alpine
    container_name: la_juanita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: la_juanita
      POSTGRES_USER: la_juanita
      POSTGRES_PASSWORD: la_juanita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
